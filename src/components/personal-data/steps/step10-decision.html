<!-- TAB 10: الدعم -->
<div class="step-pane" id="step-pane-10" style="display: none;">
  <!-- 1. كارت الدعم المقترح من الأخصائي -->
  <section class="glass-card" id="card-tab-10-proposed">
    <div class="glass-card__header">
      <div class="glass-card__title-group">
        <div class="glass-card__icon" style="background: rgba(16, 185, 129, 0.15); color: #059669;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div>
          <h2 class="glass-card__title">10. الدعم المقترح والتوصيات</h2>
          <p class="glass-card__subtitle">توصية الأخصائي الاجتماعي بنوع الدعم والقيمة والمستفيد والمبررات</p>
        </div>
      </div>
    </div>

    <div class="form-grid form-grid--3-col">
      <div class="form-group">
        <label class="form-label" for="support-type"><span>نوع الدعم المقترح</span> <span
            class="form-label__required">*</span></label>
        <div class="form-select-wrapper">
          <select id="support-type" class="form-select">
            <option value="" selected disabled>اختر نوع الدعم...</option>
            <option value="مساعدة مالية">مساعدة مالية شهرية</option>
            <option value="علاج">علاج / أدوية</option>
            <option value="تعليم">مصروفات تعليمية</option>
            <option value="تجهيز عرائس">تجهيز عرائس</option>
            <option value="غذاء">غذاء ومواد تموينية</option>
            <option value="أجهزة">أجهزة منزلية</option>
            <option value="سكن">ترميم ومستلزمات سكن</option>
            <option value="أخرى">أخرى</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="support-beneficiary"><span>المستفيد المستحق</span> <span
            class="form-label__required">*</span></label>
        <input type="text" id="support-beneficiary" class="form-input"
          placeholder="اسم رب الأسرة أو التابع...">
      </div>

      <div class="form-group">
        <label class="form-label" for="proposed-amount"><span>القيمة المقترحة (جنيه)</span> <span
            class="form-label__required">*</span></label>
        <input type="number" id="proposed-amount" class="form-input" placeholder="القيمة بالجنيه...">
      </div>

      <div class="form-group">
        <label class="form-label" for="support-duration"><span>مدة تقديم الدعم</span></label>
        <input type="text" id="support-duration" class="form-input" placeholder="مثال: مرة واحدة، 6 أشهر...">
      </div>

      <div class="form-group">
        <label class="form-label" for="support-priority"><span>درجة الأولوية</span> <span
            class="form-label__required">*</span></label>
        <div class="form-select-wrapper">
          <select id="support-priority" class="form-select">
            <option value="" selected disabled>اختر الأولوية...</option>
            <option value="عاجلة">عاجلة جداً</option>
            <option value="عالية">عالية</option>
            <option value="متوسطة">متوسطة</option>
            <option value="منخفضة">منخفضة</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="provider-entity"><span>الجهة المانحة المقترحة</span></label>
        <input type="text" id="provider-entity" class="form-input" placeholder="اسم الجمعية أو المؤسسة...">
      </div>

      <div class="form-group form-group--full">
        <label class="form-label" for="support-reason"><span>السبب الرئيسي لطلب الدعم</span> <span
            class="form-label__required">*</span></label>
        <input type="text" id="support-reason" class="form-input" placeholder="أدخل دواعي تقديم طلب الدعم...">
      </div>

      <div class="form-group form-group--full">
        <label class="form-label" for="support-justification"><span>المبررات والمشاهدات الميدانية</span> <span
            class="form-label__required">*</span></label>
        <textarea id="support-justification" class="form-input" rows="2"
          placeholder="أدخل التبريرات والظروف الميدانية..."></textarea>
      </div>
    </div>
  </section>

  <!-- 2. كارت الدعم المعتمد (View-only) -->
  <section class="glass-card" style="margin-top: 24px; border: 1.5px solid rgba(37, 99, 235, 0.4);">
    <div class="glass-card__header">
      <div class="glass-card__title-group">
        <div class="glass-card__icon" style="background: rgba(37, 99, 235, 0.15); color: #2563eb;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div>
          <h3 class="glass-card__title">سجل الدعم المعتمد والمصروف (View-only)</h3>
          <p class="glass-card__subtitle">بيانات الدعم المعتمد نهائياً من مسؤول المراجعة واللجنة</p>
        </div>
      </div>
    </div>

    <div
      style="background: rgba(37, 99, 235, 0.06); padding: 14px; border-radius: 10px; color: #1d4ed8; font-size: 13px; font-weight: 600;">
      لم يتم اتخاذ القرار النهائي بعد — في انتظار اعتماد المراجع واللجنة المالي.
    </div>
  </section>
</div>
