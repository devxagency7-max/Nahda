<!-- TAB 8: الاحتياجات -->
<div class="step-pane" id="step-pane-8" style="display: none;">
  <section class="glass-card" id="card-tab-8">
    <div class="glass-card__header" style="justify-content: space-between; flex-wrap: wrap; gap: 14px;">
      <div class="glass-card__title-group">
        <div class="glass-card__icon" style="background: rgba(236, 72, 153, 0.15); color: #db2777;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div>
          <h2 class="glass-card__title">8. الاحتياجات المحددة بعد البحث الاجتماعي</h2>
          <p class="glass-card__subtitle">الاحتياجات المطلوبة والأولوية والسبب والتكلفة التقديرية</p>
        </div>
      </div>

      <button class="btn btn--primary" id="btn-open-add-need" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>إضافة احتياج</span>
      </button>
    </div>

    <!-- Inline Add Need Form -->
    <div class="inline-member-form" id="add-need-inline-form" style="display: none; margin-bottom: 20px;">
      <div class="form-grid form-grid--2-col">
        <div class="form-group">
          <label class="form-label" for="new-need-type">نوع الاحتياج <span
              class="form-label__required">*</span></label>
          <div class="form-select-wrapper">
            <select id="new-need-type" class="form-select">
              <option value="دعم مالي">دعم مالي</option>
              <option value="علاج">علاج / أدوية</option>
              <option value="عملية جراحية">عملية جراحية</option>
              <option value="تعليم ومصروفات">تعليم ومصروفات</option>
              <option value="تجهيز عرائس">تجهيز عرائس</option>
              <option value="غذاء">غذاء ومواد تموينية</option>
              <option value="أجهزة منزلية">أجهزة منزلية</option>
              <option value="ترميم سكن">ترميم ومستلزمات سكن</option>
              <option value="أخرى">أخرى</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-need-priority">درجة الأولوية <span
              class="form-label__required">*</span></label>
          <div class="form-select-wrapper">
            <select id="new-need-priority" class="form-select">
              <option value="عاجلة">عاجلة جداً</option>
              <option value="عالية">عالية</option>
              <option value="متوسطة">متوسطة</option>
              <option value="منخفضة">منخفضة</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-need-description">وصف الاحتياج</label>
          <input type="text" id="new-need-description" class="form-input"
            placeholder="تفاصيل ودواعي طلب الاحتياج...">
        </div>

        <div class="form-group">
          <label class="form-label" for="new-need-reason">السبب</label>
          <input type="text" id="new-need-reason" class="form-input" placeholder="السبب الاجتماعي والرئيسي...">
        </div>

        <div class="form-group form-group--full">
          <label class="form-label" for="new-need-cost">التكلفة التقديرية (جنيه)</label>
          <input type="number" id="new-need-cost" class="form-input" placeholder="التكلفة المباشرة بالجنيه...">
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px;">
        <button class="btn btn--secondary" type="button" id="btn-cancel-add-need">إلغاء</button>
        <button class="btn btn--primary" type="button" id="btn-save-need">حفظ الاحتياج</button>
      </div>
    </div>

    <div id="needs-list-container">
      <div class="members-empty-state" id="needs-empty-state"
        style="text-align: center; padding: 16px; color: var(--text-muted); font-size: 13px;">
        لم يتم تحديد احتياجات بعد البحث الاجتماعي بعد. اضغط على زر "إضافة احتياج" للبدء.
      </div>
    </div>
  </section>
</div>
