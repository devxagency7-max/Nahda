<!-- TAB 7: التصنيف -->
<div class="step-pane" id="step-pane-7" style="display: none;">
  <section class="glass-card" id="card-tab-7">
    <div class="glass-card__header">
      <div class="glass-card__title-group">
        <div class="glass-card__icon" style="background: rgba(14, 165, 233, 0.15); color: #0284c7;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
            </polygon>
          </svg>
        </div>
        <div>

          <p class="glass-card__subtitle">تصنيف درجة الاستحقاق وتحديد أولوية الحالة</p>
        </div>
      </div>
    </div>

    <div class="form-grid form-grid--2-col">
      <div class="form-group">
        <label class="form-label" for="poverty-degree"><span>مستوى الاحتياج ودرجة الاستحقاق</span></label>
        <div class="form-select-wrapper">
          <select id="poverty-degree" class="form-select">
            <option value="" selected disabled>اختر مستوى الاحتياج...</option>
            <option value="مرتفع">مرتفع / أولى بالرعاية (عاجل)</option>
            <option value="متوسط">استحقاق متوسط</option>
            <option value="منخفض">منخفض / غير مستحق</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="priority-level"><span>درجة الأولوية</span></label>
        <div class="form-select-wrapper">
          <select id="priority-level" class="form-select">
            <option value="" selected disabled>اختر درجة الأولوية...</option>
            <option value="عاجلة">عاجلة جداً</option>
            <option value="عالية">عالية</option>
            <option value="متوسطة">متوسطة</option>
            <option value="منخفضة">منخفضة</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
